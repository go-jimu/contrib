name: Release Packages
# Tags each provider module that changed since its previous tag as
# <package>/<root tag>, pointing at the root tag's commit. CI calls it after
# auto-release; a root tag pushed by hand triggers it too.

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      root_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      root_tag:
        description: Root tag to publish package tags for, for example v0.9.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  release_packages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          PACKAGES: config/etcd config/nacos config/kubernetes config/apollo message/kafka taskqueue/asynq
          ROOT_TAG: ${{ inputs.root_tag || github.ref_name }}
        run: |
          set -euo pipefail

          git config --global user.name "Github Action"
          git config --global user.email "go-jimu@users.noreply.github.com"

          if ! git rev-parse -q --verify "refs/tags/${ROOT_TAG}" >/dev/null; then
            echo "Root tag ${ROOT_TAG} does not exist."
            exit 1
          fi
          root_target="$(git rev-list -n 1 "${ROOT_TAG}")"

          new_tags=()
          for package in ${PACKAGES}; do
            package_tag="${package}/${ROOT_TAG}"
            if git rev-parse -q --verify "refs/tags/${package_tag}" >/dev/null; then
              echo "Package tag ${package_tag} already exists; skipping."
              continue
            fi

            previous_tag="$(git tag --list "${package}/v*" --sort=-v:refname | head -n 1 || true)"
            if [ -n "${previous_tag}" ] && git diff --quiet "${previous_tag}" "${root_target}" -- "${package}"; then
              echo "No changes in ${package} since ${previous_tag}; skipping ${package_tag}."
              continue
            fi

            if [ -z "${previous_tag}" ]; then
              echo "No previous package tag found for ${package}; creating ${package_tag}."
            else
              echo "Changes detected in ${package} since ${previous_tag}; creating ${package_tag}."
            fi
            git tag "${package_tag}" "${root_target}"
            new_tags+=("${package_tag}")
          done

          if [ "${#new_tags[@]}" -gt 0 ]; then
            git push --atomic origin "${new_tags[@]}"
          fi
