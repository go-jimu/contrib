name: CI
# A merged pull request is tested and released once, by the push to master it
# creates. Pull request runs test the change only.
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: write

# A new push to a pull request supersedes its running checks. Master runs
# queue one at a time, so two releases never pick the same tag; a queued run
# replaced by a newer one is released by that newer run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    runs-on: ${{matrix.os}}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go 1.x
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: ${{matrix.go-version}}
          # Caching is done below: setup-go keys its cache on go.sum alone, so
          # the first build cache saved for a go.sum is reused, never refreshed.
          cache: false
      # Each master run saves a fresh build cache under its commit; every run
      # restores the newest one for its Go version and go.sum files.
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: Unittest
        run: make test
      - name: Save Go build cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Code Coverage Report
        if: ${{ matrix.go-version == '1.26.x' }}
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage.txt
          flags: unittest
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
    strategy:
      fail-fast: true
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest]
  # Releases a merged pull request: autotag reads the source branch from the
  # merge commit message. Direct pushes to master are tested, not released.
  auto_release:
    needs: unittest
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request #') }}
    outputs:
      new_tag: ${{ steps.autotag.outputs.new_tag }}
    steps:
    - name: Check out the merge commit
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Auto Tag
      id: autotag
      uses: jacexh/action-autotag@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch
    - name: Create GitHub Release
      if: ${{ steps.autotag.outputs.new_tag != '' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.autotag.outputs.new_tag }}
        name: ${{ steps.autotag.outputs.new_tag }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  auto_release_sub_packages:
    needs: auto_release
    if: ${{ needs.auto_release.outputs.new_tag != '' }}
    uses: ./.github/workflows/release-packages.yml
    with:
      root_tag: ${{ needs.auto_release.outputs.new_tag }}
